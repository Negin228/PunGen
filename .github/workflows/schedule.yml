name: Daily Pun Videos

on:
  schedule:
    - cron: "0 14 * * *"   # 9 AM ET
    - cron: "0 16 * * *"   
    - cron: "0 18 * * *"
    - cron: "0 20 * * *"   # 3 PM ET
    - cron: "0 2 * * *"   # 9 PM ET
    - cron: "0 4 * * *"
    - cron: "0 6 * * *"
    - cron: "0 8 * * *"
    - cron: "0 10 * * *"
    - cron: "0 12 * * *"



    
    
  workflow_dispatch:

jobs:
  post-videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-liberation

      - name: Install Python deps
        run: pip install -r requirements.txt

      # We run the agent directly by passing the base64 tokens securely as environment variables
      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN }}
          GOOGLE_CREDENTIALS_BASE64: ${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}
        run: python agent.py
